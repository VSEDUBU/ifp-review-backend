<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFP 測試報告審核工具 v6.0 - 企業版</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  --bg:        #F5F7FA;
  --bg2:       #FFFFFF;
  --card:      #FFFFFF;
  --card2:     #F0F4F8;
  --border:    rgba(0,0,0,0.09);
  --border2:   rgba(0,0,0,0.15);
  --accent:    #1F4E78;
  --accent2:   #004FA3;
  --text:      #1A2433;
  --muted:     #6B7A8D;
  --pass:      #70AD47;
  --fail:      #FF0000;
  --warn:      #FFC000;
  --na:        #6B7A8D;
  --pass-bg:   rgba(112,173,71,0.1);
  --fail-bg:   rgba(255,0,0,0.1);
  --warn-bg:   rgba(255,192,0,0.1);
  --scan:      #0066CC;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
header {
  background: var(--bg2);
  border-bottom: 2px solid var(--accent);
  padding: 0 28px;
  height: 64px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.logo-dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px rgba(31,78,120,0.4);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }
header h1 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px; font-weight: 600;
  letter-spacing: .06em; color: var(--accent);
}
header .subtitle {
  font-size: 11px; color: var(--muted);
  margin-left: 4px;
}
.hdr-right {
  margin-left: auto;
  display: flex; align-items: center; gap: 12px;
}
.lang-selector {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
  font-size: 11px;
  cursor: pointer;
  transition: all .2s;
}
.lang-selector:hover {
  border-color: var(--accent);
  background: rgba(31,78,120,0.05);
}
.version-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: white;
  background: var(--accent);
  padding: 4px 10px; border-radius: 4px;
  border: 1px solid var(--accent);
}

/* ── LAYOUT ── */
.main-layout {
  display: flex;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}

/* ── SIDEBAR ── */
.sidebar {
  width: 280px;
  flex-shrink: 0;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 16px 14px;
  gap: 16px;
  box-shadow: 1px 0 4px rgba(0,0,0,0.04);
}
.sidebar-section { display: flex; flex-direction: column; gap: 8px; }
.sidebar-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 600;
  color: var(--muted); letter-spacing: .14em;
  text-transform: uppercase;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--border);
}

/* MODE SELECTOR */
.mode-tabs {
  display: flex;
  gap: 4px;
  background: var(--card2);
  padding: 4px;
  border-radius: 8px;
}
.mode-tab {
  flex: 1;
  padding: 8px 10px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all .2s;
}
.mode-tab:hover {
  background: rgba(31,78,120,0.05);
  color: var(--accent);
}
.mode-tab.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
  box-shadow: 0 2px 6px rgba(31,78,120,0.2);
}

.field-row { display: flex; flex-direction: column; gap: 3px; }
.field-lbl { font-size: 11px; color: var(--muted); }
.field-input, .field-select {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 10px;
  font-family: 'Inter', sans-serif;
  font-size: 12px; color: var(--text);
  outline: none;
  transition: border-color .15s;
}
.field-input:focus, .field-select:focus { 
  border-color: var(--accent); 
  box-shadow: 0 0 0 2px rgba(31,78,120,0.1); 
}

/* upload zone */
.upload-zone {
  border: 1.5px dashed rgba(31,78,120,0.3);
  border-radius: 10px;
  padding: 20px 14px;
  text-align: center;
  cursor: pointer;
  transition: all .2s;
  background: var(--card2);
  position: relative;
}
.upload-zone:hover, .upload-zone.drag-over {
  border-color: var(--accent);
  background: rgba(31,78,120,0.04);
}
.upload-zone input[type=file] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer;
}
.upload-icon { font-size: 24px; margin-bottom: 6px; }
.upload-text { font-size: 12px; color: var(--text); font-weight: 500; }
.upload-sub { font-size: 10px; color: var(--muted); margin-top: 3px; }

.file-selected {
  background: rgba(31,78,120,0.05);
  border: 1px solid rgba(31,78,120,0.2);
  border-radius: 8px;
  padding: 9px 11px;
  display: flex; align-items: center; gap: 8px;
  font-size: 12px;
}
.file-selected .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }

/* type groups */
.type-groups { display: flex; flex-direction: column; gap: 6px; }
.type-group-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 5px 8px;
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  user-select: none;
  transition: background .12s;
}
.type-group-header:hover { background: #E8EEF5; }
.type-group-header.open { border-color: var(--accent); background: rgba(31,78,120,0.05); }
.type-group-body {
  display: none;
  flex-direction: column;
  gap: 2px;
  padding: 3px 4px 4px 4px;
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 6px 6px;
  background: var(--bg2);
  margin-top: -1px;
}
.type-group-header.open + .type-group-body { display: flex; }
.type-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px;
  border-radius: 5px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all .12s;
  background: none;
  width: 100%; text-align: left; font-size: 12px;
}
.type-item:hover { background: var(--card2); border-color: var(--border); }
.type-item.active {
  background: rgba(31,78,120,0.07);
  border-color: rgba(31,78,120,0.25);
}

/* buttons */
.analyze-btn {
  width: 100%;
  padding: 12px;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px; font-weight: 600;
  letter-spacing: .06em;
  color: #FFFFFF;
  cursor: pointer;
  transition: all .2s;
  display: flex; align-items: center;
  justify-content: center; gap: 8px;
  box-shadow: 0 2px 8px rgba(31,78,120,0.25);
}
.analyze-btn:hover:not(:disabled) {
  background: var(--accent2);
  box-shadow: 0 4px 14px rgba(31,78,120,0.35);
}
.analyze-btn:disabled {
  opacity: .4; cursor: not-allowed; box-shadow: none;
}

/* ── MAIN PANEL ── */
.main-panel {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  background: var(--bg);
}

.idle-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  opacity: .65;
}

.result-container {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px 28px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.scan-header {
  display: flex; align-items: center;
  justify-content: space-between;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.scan-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px; font-weight: 600; color: var(--accent);
  display: flex; align-items: center; gap: 8px;
}
.scan-title::before {
  content: '';
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px rgba(31,78,120,0.5);
  animation: pulse 1.2s ease-in-out infinite;
}

.scan-bar-wrap {
  height: 4px;
  background: rgba(31,78,120,0.1);
  border-radius: 2px;
  overflow: hidden;
}
.scan-bar {
  height: 100%;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  animation: sweep 1.8s ease-in-out infinite;
  width: 40%;
}
@keyframes sweep {
  0%  { transform: translateX(-100%); }
  100%{ transform: translateX(350%); }
}

.result-verdict {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 6px;
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 12px;
}
.result-verdict.pass { background: var(--pass-bg); color: var(--pass); }
.result-verdict.fail { background: var(--fail-bg); color: var(--fail); }
.result-verdict.warn { background: var(--warn-bg); color: var(--warn); }

.result-display {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  max-height: 400px;
  overflow-y: auto;
  font-size: 12px;
  line-height: 1.6;
  color: var(--text);
  white-space: pre-wrap;
  word-wrap: break-word;
}

.result-actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  flex-wrap: wrap;
}
.result-actions button {
  flex: 1;
  min-width: 120px;
  padding: 10px;
  background: var(--accent);
  border: none;
  border-radius: 6px;
  color: white;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
}
.result-actions button:hover {
  background: var(--accent2);
}

.export-options {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  padding: 12px;
  background: var(--card2);
  border-radius: 6px;
  border: 1px solid var(--border);
  flex-wrap: wrap;
}
.export-option {
  flex: 1;
  min-width: 100px;
  padding: 8px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  cursor: pointer;
  text-align: center;
  transition: all .2s;
}
.export-option:hover {
  background: rgba(31,78,120,0.07);
  border-color: var(--accent);
}

@media (max-width: 1200px) {
  .sidebar { width: 240px; }
  .main-panel { padding: 16px 20px; }
}
</style>
</head>
<body>

<header>
  <div class="logo-dot"></div>
  <h1>IFP 測試報告審核工具</h1>
  <span class="subtitle">v6.0 企業版</span>
  <div class="hdr-right">
    <select class="lang-selector" id="langSelector" onchange="changeLanguage()">
      <option value="zh_TW">繁體中文</option>
      <option value="en_US">English</option>
    </select>
    <span class="version-tag">ENTERPRISE</span>
  </div>
</header>

<div class="main-layout">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <!-- MODE SELECTOR -->
    <div class="sidebar-section">
      <div class="sidebar-label">📋 審核模式</div>
      <div class="mode-tabs">
        <button class="mode-tab active" onclick="switchMode('auto')">⚡ 自動</button>
        <button class="mode-tab" onclick="switchMode('manual')">✍️ 手動</button>
      </div>
    </div>

    <!-- REPORT TYPE -->
    <div class="sidebar-section">
      <div class="sidebar-label">📊 報告類型</div>
      <div class="type-groups" id="typeGroups"></div>
    </div>

    <!-- UPLOAD -->
    <div class="sidebar-section">
      <div class="sidebar-label">📁 選擇報告</div>
      <div class="upload-zone" id="uploadZone">
        <div class="upload-icon">📄</div>
        <div class="upload-text">點擊或拖曳上傳</div>
        <div class="upload-sub">支持 PDF 格式</div>
        <input type="file" id="fileInput" accept=".pdf">
      </div>
      <div id="fileSelected" style="display: none;"></div>
    </div>

    <!-- BACKEND CONFIG -->
    <div class="sidebar-section">
      <div class="sidebar-label">🔌 後端設置</div>
      <div class="field-row">
        <label class="field-lbl">服務 URL</label>
        <input type="text" class="field-input" id="backendUrl" value="http://localhost:5000" placeholder="http://localhost:5000">
      </div>
    </div>

    <!-- EXPORT CONFIG -->
    <div class="sidebar-section">
      <div class="sidebar-label">💾 導出設置</div>
      <div class="field-row">
        <label class="field-lbl">導出格式</label>
        <select class="field-select" id="exportFormat">
          <option value="excel">📊 Excel (.xlsx)</option>
          <option value="html">🌐 HTML (.html)</option>
          <option value="both">📦 兩種格式</option>
        </select>
      </div>
    </div>

    <!-- ANALYZE BUTTON -->
    <div class="sidebar-section">
      <button class="analyze-btn" id="analyzeBtn" onclick="startAnalysis()" disabled>
        🚀 開始審核
      </button>
    </div>
  </div>

  <!-- MAIN PANEL -->
  <div class="main-panel" id="mainPanel">
    <div class="idle-state">
      <div style="font-size: 32px;">📋</div>
      <div class="idle-title">上傳測試報告開始審核</div>
      <div style="font-size: 12px; color: var(--muted); margin-top: 8px;">v6.0 企業版 - 支持多格式導出</div>
    </div>
  </div>
</div>

<script>
// ===== 報告類型 =====
const reportTypes = {
  '📡 電磁相容': [
    { id: 'EMI', name: 'EMI 電磁騷擾', std: 'EN 55032' },
    { id: 'EMS', name: 'EMS 電磁抗擾度', std: 'EN 55035' },
    { id: 'EMC', name: 'EMC 電磁相容', std: '綜合' }
  ],
  '🔌 電氣性能': [
    { id: 'ELEC_PERF', name: '電氣性能測試', std: 'IEC 61000' },
    { id: 'POWER_SEQ', name: '電源時序測試', std: '企業標準' },
    { id: 'FREQUENCY', name: '晶振頻偏測試', std: 'GB/T 2423' }
  ],
  '📶 訊號完整性': [
    { id: 'SIGNAL_INT', name: '訊號完整性測試', std: 'USB 3.0' },
    { id: 'USB', name: 'USB 信號測試', std: 'USB 2.0/3.0' },
    { id: 'HDMI', name: 'HDMI 信號測試', std: 'HDMI 1.4+' }
  ],
  '🌡️ 可靠性環測': [
    { id: 'RELIABILITY', name: '可靠性試驗', std: 'GB/T 2423' },
    { id: 'TEMP_RISE', name: '溫升試驗', std: 'IEC 60950' },
    { id: 'THERMAL', name: '熱測試', std: '企業標準' }
  ],
  '⚡ 性能能效': [
    { id: 'ENERGY', name: '能效測試', std: 'ENERGY STAR' },
    { id: 'PERFORMANCE', name: '性能測試', std: '企業標準' }
  ],
  '📋 設計評估': [
    { id: 'DERATING', name: 'Derating 降額分析', std: 'MIL-HDBK-217' },
    { id: 'SAFETY', name: '安規測試', std: 'IEC 62368-1' }
  ]
};

let currentMode = 'auto';
let currentLanguage = 'zh_TW';
let selectedType = 'AUTO';
let selectedFile = null;
let analysisController = null;

// ===== 初始化 =====
function init() {
  renderTypeGroups();
  setupUploadZone();
  loadSettings();
}

function renderTypeGroups() {
  const container = document.getElementById('typeGroups');
  container.innerHTML = '';
  
  Object.entries(reportTypes).forEach(([group, items]) => {
    const groupEl = document.createElement('div');
    groupEl.className = 'type-group';
    
    const header = document.createElement('div');
    header.className = 'type-group-header';
    header.innerHTML = `
      <div style="flex: 1; font-size: 12px; font-weight: 600;">${group}</div>
      <div style="color: var(--muted); font-size: 10px;">(${items.length})</div>
    `;
    header.onclick = () => {
      header.classList.toggle('open');
      body.style.display = header.classList.contains('open') ? 'flex' : 'none';
    };
    
    const body = document.createElement('div');
    body.className = 'type-group-body';
    body.innerHTML = items.map(item => `
      <button class="type-item" onclick="selectType('${item.id}', this)">
        <span style="font-weight: 600;">${item.name}</span>
        <span style="font-size: 10px; color: var(--muted); flex: 1; text-align: right;">${item.std}</span>
      </button>
    `).join('');
    
    groupEl.appendChild(header);
    groupEl.appendChild(body);
    container.appendChild(groupEl);
  });
}

function selectType(type, el) {
  document.querySelectorAll('.type-item').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  selectedType = type;
}

function setupUploadZone() {
  const zone = document.getElementById('uploadZone');
  const input = document.getElementById('fileInput');
  
  zone.onclick = () => input.click();
  zone.ondragover = (e) => {
    e.preventDefault();
    zone.classList.add('drag-over');
  };
  zone.ondragleave = () => zone.classList.remove('drag-over');
  zone.ondrop = (e) => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) {
      input.files = e.dataTransfer.files;
      updateFileSelected();
    }
  };
  
  input.onchange = updateFileSelected;
}

function updateFileSelected() {
  const file = document.getElementById('fileInput').files[0];
  const zone = document.getElementById('uploadZone');
  const selected = document.getElementById('fileSelected');
  
  if (file) {
    selectedFile = file;
    zone.style.display = 'none';
    selected.innerHTML = `
      <div class="file-selected">
        <span class="fname">${file.name}</span>
        <button onclick="clearFile()" style="background: none; border: none; cursor: pointer; color: var(--fail);">✕</button>
      </div>
    `;
    selected.style.display = 'block';
    document.getElementById('analyzeBtn').disabled = false;
  }
}

function clearFile() {
  selectedFile = null;
  document.getElementById('fileInput').value = '';
  document.getElementById('uploadZone').style.display = 'block';
  document.getElementById('fileSelected').style.display = 'none';
  document.getElementById('analyzeBtn').disabled = true;
}

function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
}

function changeLanguage() {
  currentLanguage = document.getElementById('langSelector').value;
  // 可以添加動態語言切換邏輯
}

function startAnalysis() {
  if (!selectedFile || !selectedType) return;
  
  if (currentMode === 'auto') {
    analyzeAuto();
  } else {
    analyzeManual();
  }
}

async function analyzeAuto() {
  const mainPanel = document.getElementById('mainPanel');
  const backendUrl = document.getElementById('backendUrl').value;
  
  analysisController = new AbortController();
  
  mainPanel.innerHTML = `
    <div class="result-container">
      <div class="scan-header">
        <div class="scan-title">正在分析報告...</div>
      </div>
      <div class="scan-bar-wrap">
        <div class="scan-bar"></div>
      </div>
      <div style="text-align: center; color: var(--muted); font-size: 12px; margin-top: 20px;">
        調用 AI 模型進行審核<br>
        <span style="font-size: 11px; opacity: 0.7;">這可能需要 30-60 秒</span>
      </div>
      <div style="margin-top: 16px; text-align: center;">
        <button onclick="cancelAnalysis()" style="padding: 8px 16px; background: #FF6B6B; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;">⏹️ 取消分析</button>
      </div>
    </div>
  `;
  
  try {
    const formData = new FormData();
    formData.append('file', selectedFile);
    formData.append('type', selectedType);
    
    const response = await fetch(`${backendUrl}/api/review`, {
      method: 'POST',
      body: formData,
      signal: analysisController.signal
    });
    
    const data = await response.json();
    
    if (data.status === 'success') {
      showAutoResult(data);
    } else {
      showError(data.message || '分析失敗');
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      showError('❌ 分析已取消');
    } else {
      showError(`網路錯誤: ${err.message}`);
    }
  }
}

function analyzeManual() {
  const mainPanel = document.getElementById('mainPanel');
  mainPanel.innerHTML = `
    <div class="result-container">
      <div style="text-align: center; padding: 20px;">
        <div style="font-size: 18px; margin-bottom: 10px;">📋 手動模式</div>
        <p style="color: var(--muted); margin-bottom: 20px;">請在 Claude.ai 中分析報告，然後將結果粘貼到工具中</p>
        <button class="analyze-btn" onclick="alert('手動模式：請複製 Prompt 到 Claude.ai 進行分析')" style="width: 100%;">
          🔗 打開 Claude.ai
        </button>
      </div>
    </div>
  `;
}

function showAutoResult(data) {
  const mainPanel = document.getElementById('mainPanel');
  const verdict = data.verdict;
  const verdictClass = verdict.toLowerCase();
  const verdictText = {
    'PASS': '✅ 通過',
    'FAIL': '❌ 失敗',
    'WARN': '⚠️ 警告',
    'CONTRADICTION': '🔴 矛盾'
  }[verdict] || verdict;
  
  const exportFormat = document.getElementById('exportFormat').value;
  
  mainPanel.innerHTML = `
    <div class="result-container">
      <div class="scan-header">
        <div>
          <div class="result-verdict ${verdictClass}">${verdictText}</div>
          <div style="font-size: 11px; color: var(--muted);">
            📄 ${data.filename} | ${new Date(data.timestamp).toLocaleString('zh-TW')}
          </div>
        </div>
      </div>
      
      <div class="result-display">${data.result}</div>
      
      <div class="result-actions">
        <button onclick="copyResult(\`${data.result.replace(/`/g, '\\`')}\`)">📋 複製結果</button>
        <button onclick="downloadReport('${data.filename.replace(/'/g, "\\'")}', ${JSON.stringify(data).replace(/"/g, '&quot;')}, '${exportFormat}')">💾 下載報告</button>
        <button onclick="startNewAnalysis()">🔄 新建審核</button>
      </div>
    </div>
  `;
}

function showError(msg) {
  const mainPanel = document.getElementById('mainPanel');
  mainPanel.innerHTML = `
    <div class="result-container">
      <div style="color: var(--fail); font-weight: 600; margin-bottom: 12px;">❌ 錯誤</div>
      <div style="color: var(--muted); font-size: 12px; margin-bottom: 16px;">${msg}</div>
      <button class="analyze-btn" onclick="startNewAnalysis()" style="width: 100%;">🔄 重新開始</button>
    </div>
  `;
}

function downloadReport(filename, data, format) {
  const backendUrl = document.getElementById('backendUrl').value || 'http://localhost:5000';
  const lang = document.getElementById('langSelector').value;
  
  if (format === 'both' || format === 'excel') {
    downloadExcel(backendUrl, data, lang);
  }
  if (format === 'both' || format === 'html') {
    downloadHTML(backendUrl, data, lang);
  }
}

function downloadExcel(backendUrl, data, lang) {
  fetch(`${backendUrl}/api/export/excel?lang=${lang}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  })
  .then(res => res.blob())
  .then(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${data.filename.replace('.pdf', '')}_審核結果.xlsx`;
    a.click();
    URL.revokeObjectURL(url);
  })
  .catch(err => alert(`❌ Excel 下載失敗: ${err.message}`));
}

function downloadHTML(backendUrl, data, lang) {
  fetch(`${backendUrl}/api/export/html?lang=${lang}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  })
  .then(res => res.blob())
  .then(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${data.filename.replace('.pdf', '')}_審核結果.html`;
    a.click();
    URL.revokeObjectURL(url);
  })
  .catch(err => alert(`❌ HTML 下載失敗: ${err.message}`));
}

function cancelAnalysis() {
  if (analysisController) {
    analysisController.abort();
    showError('❌ 分析已取消');
  }
}

function copyResult(text) {
  navigator.clipboard.writeText(text).then(() => {
    alert('✅ 結果已複製');
  });
}

function startNewAnalysis() {
  clearFile();
  location.reload();
}

function loadSettings() {
  const saved = localStorage.getItem('ifp_backend_url');
  if (saved) {
    document.getElementById('backendUrl').value = saved;
  }
}

window.onbeforeunload = () => {
  localStorage.setItem('ifp_backend_url', document.getElementById('backendUrl').value);
};

init();
</script>

</body>
</html>
